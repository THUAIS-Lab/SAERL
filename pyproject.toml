[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saerl"
version = "0.1.0"
description = "Static gradient SAE representations and data selection for RL"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dynamic = ["optional-dependencies"]
dependencies = ["numpy>=1.26,<2", "pyarrow>=19"]

[project.scripts]
saerl-train = "saerl.verl.train:main"
saerl-extract = "saerl.selection.extraction:main"
saerl-select = "saerl.selection.sample_selection:main"
saerl-feature-select = "saerl.selection.feature_selection:main"

[tool.setuptools]
package-dir = {saerl = "src"}
packages = [
  "saerl",
  "saerl.config",
  "saerl.verl",
  "saerl.selection",
]

[tool.setuptools.package-data]
"saerl.config" = ["*.yaml"]

[tool.setuptools.dynamic.optional-dependencies]
train = {file = ["requirements-train.txt"]}
