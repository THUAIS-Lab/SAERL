defaults:
  - base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  adv_estimator: grpo

data:
  shuffle: false
  dataloader_num_workers: 0
  filter_overlong_prompts: false
  train_max_samples: -1
  sampler:
    class_path: pkg://saerl.verl.curriculum_sampler
    class_name: SAERLSampler
  saerl:
    processed_file: null
